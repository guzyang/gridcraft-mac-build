name: macOS unsigned build

# Builds GridCraft for macOS on GitHub's own macOS runner and uploads the .dmg as an artifact.
# No Apple certificate is used: the app is ad-hoc signed, so the first launch needs
# "right-click > Open" (or: xattr -dr com.apple.quarantine /Applications/GridCraft.app).
#
# Run it from the Actions tab ("Run workflow"), then download the artifact from the run page.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the craft-fonts faces
        run: |
          git clone --depth 1 https://github.com/storytold/craft-fonts.git "$RUNNER_TEMP/craft-fonts"
          git -C "$RUNNER_TEMP/craft-fonts" fetch --depth 1 origin b076417b5880bd4154bd22f00695b1d28c6bea83
          git -C "$RUNNER_TEMP/craft-fonts" checkout -q b076417b5880bd4154bd22f00695b1d28c6bea83
      - name: Rust toolchain with the Apple Silicon target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build, bundle and package (ad-hoc signed)
        env:
          MACOS_SIGN_IDENTITY: "-"
          # The faces the release build embeds, so Chinese text has the intended face instead of
          # whatever the machine happens to have.
          CRAFT_FONTS_DIR: ${{ runner.temp }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: |
          # Apple Silicon only: it is the machine the user has, it builds in half the time and
          # the .dmg is half the size. A universal build is a separate run if it is ever needed.
          ./packaging/macos/package.sh --arch aarch64
      - name: Upload the .dmg files
        uses: actions/upload-artifact@v7
        with:
          name: gridcraft-macos-unsigned
          path: dist/release/*.dmg
          if-no-files-found: error
